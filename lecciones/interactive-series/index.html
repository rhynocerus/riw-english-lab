const params=new URLSearchParams(location.search),type=params.get("type")==="dialogue"?"dialogue":"listen",level=Math.max(1,Math.min(6,Number(params.get("level"))||1)),set=type==="listen"?listening[level-1]:dialogues[level-1],$=id=>document.getElementById(id);let i=0,score=0,answered=false,voiceStarted=false;

function utter(t,rate=.88){if(!("speechSynthesis" in window)){$("status").textContent="La síntesis de voz no está disponible en este navegador.";return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=rate;const voices=speechSynthesis.getVoices();const v=voices.find(v=>v.lang.toLowerCase().startsWith("en-gb"))||voices.find(v=>v.lang.toLowerCase().startsWith("en"));if(v)u.voice=v;$("status").textContent=v?"Voz: "+v.name:"Voz inglesa del sistema";riwSpeak(u);}
function spoken(){if(type==="listen")return set.words[i][0];const q=set.items[i];return q[0]+": "+q[1]+". "+q[2]+": "+q[4][q[5]];}
function speak(rate){utter(spoken(),rate)}
function render(){answered=false;$("counter").textContent="Desafío "+(i+1)+" / 6";$("score").textContent="⭐ "+score+" puntos";$("bar").style.width=((i+1)/6*100)+"%";$("feedback").classList.add("hidden");$("next").classList.add("hidden");$("stage").innerHTML="";$("answers").innerHTML="";const stage=$("stage"),ans=$("answers");if(type==="listen"){const p=document.createElement("p");p.textContent="Escucha y elige la imagen correcta:";stage.append(p);ans.className="cards";const options=[i,(i+2)%6,(i+4)%6].sort((a,b)=>((a*7+i*3)%11)-((b*7+i*3)%11));options.forEach(k=>{const b=document.createElement("button");b.className="tile";b.type="button";const pic=document.createElement("span");pic.className="picture";pic.textContent=set.words[k][1];pic.setAttribute("aria-label",set.words[k][0]);b.append(pic);b.setAttribute("aria-label","Imagen: "+set.words[k][0]);b.addEventListener("click",()=>choose(k===i,b));ans.append(b)});}else{const q=set.items[i];stage.innerHTML='<div class="scene"><div class="picture" aria-hidden="true">'+set.scene+'</div><strong>'+set.title+'</strong></div>';const d=document.createElement("div");d.className="dialogue";const p1=document.createElement("p"),p2=document.createElement("p");p1.textContent=q[0]+": "+q[1];p2.textContent=q[2]+": ______";d.append(p1,p2);stage.append(d);ans.className="choices";q[4].forEach((opt,k)=>{const b=document.createElement("button");b.className="choice";b.type="button";b.textContent=opt;b.addEventListener("click",()=>choose(k===q[5],b));ans.append(b)});}if(!voiceStarted){voiceStarted=true;setTimeout(()=>speak(.88),400);}}
function choose(ok,selected){if(answered)return;answered=true;if(ok)score++;const all=[...$("answers").querySelectorAll("button")];all.forEach(b=>b.disabled=true);selected.classList.add(ok?"correct":"wrong");const correct=type==="listen"?all.find(b=>b.getAttribute("aria-label")==="Imagen: "+set.words[i][0]):all[set.items[i][5]];if(correct)correct.classList.add("correct");$("score").textContent="⭐ "+score+" puntos";$("feedback").textContent=(ok?"¡Correcto! 🎉 ":"Buen intento. 🔎 ")+(type==="listen"?"La palabra era "+set.words[i][0]+".":set.items[i][6]);$("feedback").classList.remove("hidden");$("next").textContent=i===5?"Ver resultado →":"Siguiente desafío →";$("next").classList.remove("hidden");}

render();
</script><style id="riw-voice-style">#riw-voice-box{position:relative;margin:12px auto;padding:12px 15px;border:1px solid #608f91;border-radius:13px;background:#16333e;color:#f0fff9;max-width:850px;font:inherit}#riw-voice-box label{display:block;font-weight:700;margin-bottom:6px}#riw-voice-box select{width:100%;max-width:420px;padding:10px;border-radius:9px;background:#f4fffb;color:#153038;font:inherit}#riw-voice-hint{font-size:.83rem;margin:7px 0 0;color:#d1e7df}</style><script id="riw-voice-script">
(function(){
const KEY="riw-english-lab-voice";
const female=/\b(google uk english female|samantha|victoria|karen|moira|fiona|tessa|serena|susan|hazel|zira|aria|jenny|sonia|libby|maisie|natasha|emma|olivia|amy|joanna|salli|ivy|kimberly|nicole|raveena|allison|ava|kate)\b/i;
const male=/\b(google uk english male|daniel|alex|fred|tom|oliver|ryan|guy|david|mark|george|brian|arthur|matthew|joey|justin|kevin|michael|james|stephen|alfie)\b/i;
let choice="female";try{choice=localStorage.getItem(KEY)||"female"}catch(e){}
const box=document.createElement("div");box.id="riw-voice-box";box.innerHTML='<label for="riw-voice-choice">🎙️ Elige la voz de pronunciación</label><select id="riw-voice-choice"><option value="female">👩 Voz femenina</option><option value="male">👨 Voz masculina</option></select><p id="riw-voice-hint" aria-live="polite"></p>';
function init(){const main=document.querySelector("main")||document.body;const header=main.querySelector("header");if(header)header.insertAdjacentElement("afterend",box);else main.prepend(box);const select=document.getElementById("riw-voice-choice");select.value=choice;select.addEventListener("change",()=>{choice=select.value;try{localStorage.setItem(KEY,choice)}catch(e){};updateHint();});updateHint();}
function voices(){if(!("speechSynthesis" in window))return[];return speechSynthesis.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang));}
function preferred(){const list=voices(),pattern=choice==="male"?male:female;return list.find(v=>/^en-gb$/i.test(v.lang)&&pattern.test(v.name))||list.find(v=>pattern.test(v.name))||null;}
function updateHint(){const hint=document.getElementById("riw-voice-hint");if(!hint)return;const v=preferred(),list=voices();hint.textContent=v?"Voz seleccionada: "+v.name+" ("+v.lang+").":list.length?"Tu navegador no identifica una voz "+(choice==="male"?"masculina":"femenina")+" en inglés. Se usará una voz inglesa disponible.":"Las voces se cargarán según el navegador; pulsa 🔊 para probar.";}
window.riwSpeak=function(u){if(!("speechSynthesis" in window))return;const v=preferred();if(v){u.voice=v;u.lang=v.lang;}else{const list=voices();if(list.length){u.voice=list.find(v=>/^en-gb$/i.test(v.lang))||list[0];u.lang=u.voice.lang;}}updateHint();speechSynthesis.speak(u);};
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
if("speechSynthesis" in window)speechSynthesis.addEventListener?.("voiceschanged",updateHint);
})();
</script></body></html>
